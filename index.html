<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WRTE — iRacing Schedule</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; background:#000; color:#e8ffe8; font-family:system-ui,-apple-system,Segoe UI,sans-serif; padding:24px 16px 48px; }
  .wrap { max-width:1100px; margin:0 auto; }
  header { display:flex; align-items:center; gap:20px; border:1px solid #39FF14; padding:18px 20px; margin-bottom:20px; box-shadow:0 0 20px rgba(57,255,20,.15); }
  header img { height:72px; width:auto; }
  .kicker { font-size:12px; letter-spacing:.22em; color:#39FF14; text-transform:uppercase; }
  h1 { margin:4px 0 0; font-size:28px; color:#39FF14; letter-spacing:.04em; }
  h2 { margin:0 0 10px; font-size:14px; letter-spacing:.18em; color:#39FF14; text-transform:uppercase; }
  .card { border:1px solid #39FF14; padding:12px; margin-bottom:18px; box-shadow:0 0 16px rgba(57,255,20,.1); }
  .card img { width:100%; height:auto; display:block; background:#000; }
  footer { margin-top:8px; display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; font-size:11px; letter-spacing:.12em; color:#3a783a; text-transform:uppercase; }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <img src="assets/wrte-logo.png" alt="Worst Racing Team Ever">
      <div>
        <div class="kicker">IRACING</div>
        <h1>SEASON 4 · WEEK 1</h1>
      </div>
    </header>
    <h2>Sports Car</h2>
    <div class="card"><img src="week-sports-car.png" alt="Sports Car weekly overview"></div>
    <h2>Formula</h2>
    <div class="card"><img src="week-formula.png" alt="Formula weekly overview"></div>
    <footer>
      <span>Worst Racing Team Ever</span>
      <span>Updated from schedule · confirm in UI</span>
    </footer>
  </div>
</body>
</html>
