<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WRTE — iRacing Schedule</title>
<style>
:root {
  --bg:#000; --ink:#e8ffe8; --green:#39FF14; --muted:#6a8f6a; --track:#b8e6b8;
  --row:#081408; --line:#1f3a1f;
  --cR:#d23b2e; --cD:#f0921e; --cC:#f2c51d; --cB:#1e8e4c; --cA:#2367b3;
}
* { box-sizing:border-box; }
body {
  margin:0; min-height:100vh; background:var(--bg); color:var(--ink);
  font:15px/1.4 system-ui, -apple-system, Segoe UI, sans-serif;
  padding:20px 16px 48px;
}
.wrap { max-width:1100px; margin:0 auto; }
.frame {
  border:1px solid var(--green);
  box-shadow:0 0 24px rgba(57,255,20,.16);
  padding:18px 18px 12px;
}
header { display:flex; gap:18px; align-items:center; margin-bottom:14px; padding-bottom:14px; border-bottom:1px solid rgba(57,255,20,.35); }
header img { height:68px; width:auto; }
.kicker { font-size:11px; letter-spacing:.24em; color:var(--green); text-transform:uppercase; }
h1 { margin:4px 0 0; font-size:clamp(22px,4vw,30px); color:var(--green); letter-spacing:.04em; }
.row { margin:10px 0; }
.label {
  display:block; margin:0 0 6px; font-size:11px; letter-spacing:.16em;
  text-transform:uppercase; color:var(--muted); font-weight:700;
}
.seg, .weeks, .ranks { display:flex; gap:6px; flex-wrap:wrap; }
.seg button, .weeks button, .ranks button {
  appearance:none; border:1px solid var(--line); background:#050805; color:var(--ink);
  padding:8px 12px; border-radius:6px; cursor:pointer; font:600 12px/1 system-ui;
}
.seg button.active, .weeks button.active, .ranks button.active {
  border-color:var(--green); color:#000; background:var(--green);
  box-shadow:0 0 12px rgba(57,255,20,.35);
}
.weeks button { min-width:40px; padding:8px 0; }
.ranks button .dot {
  display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px;
  vertical-align:middle;
}
.ranks button.active .dot { box-shadow:0 0 0 1px #000; }
.dot.R { background:var(--cR); }
.dot.D { background:var(--cD); }
.dot.C { background:var(--cC); }
.dot.B { background:var(--cB); }
.dot.A { background:var(--cA); }
.dot.U { background:#777; }
.meta { color:var(--muted); font-size:13px; margin:4px 0 12px; }
.heading {
  display:flex; align-items:center; gap:10px; margin:0 0 10px;
}
.badge {
  display:inline-flex; align-items:center; justify-content:center;
  min-width:28px; height:28px; padding:0 8px; border-radius:4px;
  font:800 13px/1 system-ui; color:#fff;
}
.badge.R { background:var(--cR); }
.badge.D { background:var(--cD); color:#15181d; }
.badge.C { background:var(--cC); color:#15181d; }
.badge.B { background:var(--cB); }
.badge.A { background:var(--cA); }
.badge.U { background:#555; }
.heading h2 { margin:0; font-size:14px; letter-spacing:.12em; text-transform:uppercase; color:var(--green); }
.heading .count { color:var(--muted); font-size:12px; margin-left:auto; }
table { width:100%; border-collapse:collapse; }
th {
  text-align:left; font-size:11px; letter-spacing:.16em; color:var(--green);
  padding:0 10px 8px; text-transform:uppercase; font-weight:700;
}
td { padding:9px 10px; border-top:1px solid var(--line); vertical-align:top; }
tr.alt td { background:var(--row); }
td.series { font-weight:700; color:#f2fff2; width:38%; }
td.mid { color:var(--track); }
.tag {
  display:inline-block; margin-left:6px; padding:1px 6px; border-radius:3px;
  background:#1a241a; color:var(--muted); font-size:10px; font-weight:700;
  vertical-align:middle;
}
.idle { margin-top:14px; padding-top:10px; border-top:1px dashed var(--line); }
.idle h3 { margin:0 0 8px; font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--green); }
footer {
  margin-top:16px; display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap;
  font-size:11px; letter-spacing:.12em; color:#3a783a; text-transform:uppercase;
}
@media (max-width:700px) {
  td.series, td.mid { display:block; width:auto; text-align:left; }
  th { display:none; }
}
</style>
</head>

function currentWeek() {
  const start = new Date(DATA.seasonStart + 'T00:00:00Z');
  const days = Math.floor((Date.now() - start) / 86400000);
  return Math.min(DATA.weeks, Math.max(1, 1 + Math.floor(days / 7)));
}

function defaultRank(cat) {
  const order = ['A','B','C','D','R'];
  const ranks = (cat.groups || []).map(g => g.cls);
  for (const c of order) if (ranks.includes(c)) return c;
  return ranks[0] || 'R';
}

const firstCat = DATA.classes.find(c => c.key === 'sports-car') || DATA.classes[0];
let state = {
  classKey: firstCat.key,
  rank: defaultRank(firstCat),
  week: currentWeek()
};

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtDate(iso) {
  if (!iso) return '';
  return new Date(iso + 'T00:00:00').toLocaleDateString('en-GB', { day:'numeric', month:'short' });
}
function weekWindow(weekNum) {
  const start = new Date(DATA.seasonStart + 'T00:00:00Z');
  const from = new Date(start); from.setUTCDate(from.getUTCDate() + (weekNum-1)*7);
  const to = new Date(from); to.setUTCDate(to.getUTCDate() + 6);
  return { from, to };
}
function weekEntry(series, weekNum) {
  const direct = (series.weeks || []).find(w => w.w === weekNum);
  if (direct) return direct;
  const { from, to } = weekWindow(weekNum);
  return (series.weeks || []).find(w => {
    if (!w.d) return false;
    const d = new Date(w.d + 'T00:00:00Z');
    return d >= from && d <= to;
  }) || null;
}
function tagsHtml(series) {
  return (series.tags || []).map(t => `<span class="tag">${esc(t)}</span>`).join('');
}
function rowMid(series, w) {
  if (series.ringMeister) return w.car || 'TBD car';
  return w.track || '—';
}
function currentCat() {
  return DATA.classes.find(c => c.key === state.classKey);
}
function currentGroup() {
  const cat = currentCat();
  return (cat.groups || []).find(g => g.cls === state.rank) || (cat.groups || [])[0];
}

function renderControls() {
  const cat = currentCat();
  document.getElementById('classSeg').innerHTML = DATA.classes.map(c =>
    `<button type="button" data-class="${esc(c.key)}" class="${c.key===state.classKey?'active':''}">${esc(c.label)}</button>`
  ).join('');
  document.querySelectorAll('#classSeg button').forEach(b => b.onclick = () => {
    state.classKey = b.dataset.class;
    const next = DATA.classes.find(c => c.key === state.classKey);
    const ranks = (next.groups || []).map(g => g.cls);
    if (!ranks.includes(state.rank)) { const order=['A','B','C','D','R']; state.rank = order.find(c => ranks.includes(c)) || ranks[0] || 'R'; }
    render();
  });

  document.getElementById('rankSeg').innerHTML = [...(cat.groups || [])].sort((a,b) => {
    const order = {A:0,B:1,C:2,D:3,R:4};
    return (order[a.cls] ?? 9) - (order[b.cls] ?? 9);
  }).map(g => {
    const badge = ['R','D','C','B','A'].includes(g.cls) ? g.cls : 'U';
    return `<button type="button" data-rank="${esc(g.cls)}" class="${g.cls===state.rank?'active':''}"><span class="dot ${badge}"></span>${esc(g.label)}</button>`;
  }).join('');
  document.querySelectorAll('#rankSeg button').forEach(b => b.onclick = () => {
    state.rank = b.dataset.rank;
    render();
  });

  document.getElementById('weekSeg').innerHTML = Array.from({length: DATA.weeks}, (_,i) => i+1).map(w =>
    `<button type="button" data-week="${w}" class="${w===state.week?'active':''}">${w}</button>`
  ).join('');
  document.querySelectorAll('#weekSeg button').forEach(b => b.onclick = () => {
    state.week = +b.dataset.week;
    render();
  });
}

function render() {
  renderControls();
  const cat = currentCat();
  const group = currentGroup();
  document.getElementById('title').textContent = 'SEASON 4 · WEEK ' + state.week;
  const { from, to } = weekWindow(state.week);
  document.getElementById('meta').textContent =
    cat.label + ' · ' + (group ? group.label : '') + ' · ' +
    fmtDate(from.toISOString().slice(0,10)) + ' – ' + fmtDate(to.toISOString().slice(0,10));

  if (!group) {
    document.getElementById('main').innerHTML = '<p class="meta">No series in this rank.</p>';
    return;
  }

  const active = [], idle = [];
  for (const s of group.series) {
    const w = weekEntry(s, state.week);
    if (w) active.push({ s, w });
    else {
      const next = (s.weeks || []).find(x => x.d && new Date(x.d+'T00:00:00Z') > to)
                || (s.weeks || []).find(x => (x.w || 0) > state.week);
      idle.push({ s, next });
    }
  }

  const badge = ['R','D','C','B','A'].includes(group.cls) ? group.cls : 'U';
  const useCar = active.length && active.every(a => a.s.ringMeister);
  let html = `<div class="heading">
    <span class="badge ${badge}">${esc(group.cls)}</span>
    <h2>${esc(group.label)}</h2>
    <span class="count">${active.length} this week · ${group.series.length} series</span>
  </div>`;

  if (active.length) {
    html += `<table><thead><tr><th>Series</th><th>${useCar ? 'Car' : 'Track'}</th></tr></thead><tbody>`;
    active.forEach((row, i) => {
      const mid = rowMid(row.s, row.w);
      html += `<tr class="${i%2?'':'alt'}"><td class="series">${esc(row.s.name)}${tagsHtml(row.s)}</td><td class="mid">${esc(mid)}</td></tr>`;
    });
    html += `</tbody></table>`;
  } else {
    html += `<p class="meta">No rounds this week in ${esc(group.label)}.</p>`;
  }

  if (idle.length) {
    html += `<div class="idle"><h3>Not this week</h3><table><tbody>`;
    idle.forEach((row, i) => {
      html += `<tr class="${i%2?'':'alt'}"><td class="series" style="color:var(--muted)">${esc(row.s.name)}${tagsHtml(row.s)}</td></tr>`;
    });
    html += `</tbody></table></div>`;
  }

  document.getElementById('main').innerHTML = html;
}
render();
</script>
